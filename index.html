<!DOCTYPE html>
<html lang="en" style="background-color: #0F172A">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F0F4F8" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Somnia.ai">
    <meta name="description"
        content="Intelligent sleep and dream wellness application. Track your dreams, analyze patterns, and improve your sleep.">
    <meta property="og:title" content="Somnia.ai | Intelligent Dream Journal">
    <meta property="og:description"
        content="Track your dreams with AI-powered analysis. Understand patterns, symbols, and improve your sleep quality.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Somnia.ai">
    <meta name="twitter:description" content="AI-powered dream journal and sleep wellness app">
    <!-- Content Security Policy - Restricts resource loading for XSS protection -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://*.supabase.co https://*.googleapis.com https://generativelanguage.googleapis.com https://nominatim.openstreetmap.org https://api.revenuecat.com;
        media-src 'self' blob: data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
    ">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="manifest" href="/manifest.json">
    <title>Somnia.ai | Intelligent Alarm & Dream Journal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload critical fonts for better LCP -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcC73FwrK3iLTeHuS_fvQtMwCp50KnMa1ZL7.woff2" as="font" type="font/woff2" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Quattrocento:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Circadian Deep Night - even darker than regular night */
        html[data-circadian-phase="night"].dark {
            --night-bg-start: #050810;
            --night-bg-end: #0a0f1a;
            --night-card-bg: rgba(10, 15, 30, 0.8);
        }

        /* Circadian Dusk/Dawn - uses warmer tones */
        html[data-circadian-phase="dusk"].dark,
        html[data-circadian-phase="dawn"].dark {
            --night-bg-start: #0F172A;
            --night-bg-end: #1E293B;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(100, 116, 139, 0.3);
            border-radius: 6px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3);
        }

        /* Focus-visible for keyboard navigation accessibility */
        :focus-visible {
            outline: 2px solid #6366F1;
            outline-offset: 2px;
        }

        .dark :focus-visible {
            outline-color: #818CF8;
        }

        /* Sleep Mode: Zero blue light for melatonin preservation */
        .sleep :focus-visible {
            outline-color: #FF6B35;
        }

        .sleep .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 107, 53, 0.3);
        }

        /* Sleep Mode Color Overrides - replaces all blue with warm amber */
        .sleep {
            --tw-gradient-from: #1A0A00 !important;
            --tw-gradient-to: #2D1810 !important;
        }

        /* Override night colors with sleep colors when .sleep is active */
        .sleep .bg-night-accent {
            background-color: #FF6B35 !important;
        }

        .sleep .text-night-accent {
            color: #FF6B35 !important;
        }

        .sleep .border-night-accent {
            border-color: #FF6B35 !important;
        }

        .sleep .text-night-text-primary {
            color: #FFD4B8 !important;
        }

        .sleep .text-night-text-secondary {
            color: #C4A68A !important;
        }

        .sleep .bg-night-card-bg {
            background-color: rgba(45, 24, 16, 0.65) !important;
        }

        .sleep .border-night-border {
            border-color: rgba(255, 107, 53, 0.2) !important;
        }

        .sleep .from-night-bg-start {
            --tw-gradient-from: #1A0A00 !important;
        }

        .sleep .to-night-bg-end {
            --tw-gradient-to: #2D1810 !important;
        }

        /* Override indigo accents (common across app) */
        .sleep .bg-indigo-500,
        .sleep .bg-indigo-500\/20 {
            background-color: #FF6B35 !important;
        }

        .sleep .bg-indigo-600 {
            background-color: #E55A2B !important;
        }

        .sleep .text-indigo-500 {
            color: #FF6B35 !important;
        }

        .sleep .text-indigo-400 {
            color: #FF8C5A !important;
        }

        .sleep .border-indigo-500 {
            border-color: #FF6B35 !important;
        }

        .sleep .ring-indigo-500 {
            --tw-ring-color: #FF6B35 !important;
        }

        .sleep .accent-night-accent {
            accent-color: #FF6B35 !important;
        }

        /* Sleep mode gradient backgrounds */
        html.sleep.dark .from-night-bg-start {
            --tw-gradient-from: #1A0A00 !important;
        }

        html.sleep.dark .to-night-bg-end {
            --tw-gradient-to: #2D1810 !important;
        }

        html.sleep .dark\:from-night-bg-start {
            --tw-gradient-from: #1A0A00 !important;
        }

        html.sleep .dark\:to-night-bg-end {
            --tw-gradient-to: #2D1810 !important;
        }

        /* Override background color for html/body elements in sleep mode */
        html.sleep.dark\:bg-night-bg-start,
        html.sleep .dark\:bg-night-bg-start {
            background-color: #1A0A00 !important;
        }

        html.sleep .dark\:bg-night-accent {
            background-color: #FF6B35 !important;
        }

        html.sleep .dark\:text-night-accent {
            color: #FF6B35 !important;
        }

        html.sleep .dark\:text-night-text-primary {
            color: #FFD4B8 !important;
        }

        html.sleep .dark\:text-night-text-secondary {
            color: #C4A68A !important;
        }

        html.sleep .dark\:bg-night-card-bg {
            background-color: rgba(45, 24, 16, 0.65) !important;
        }

        html.sleep .dark\:border-night-border {
            border-color: rgba(255, 107, 53, 0.2) !important;
        }

        /* Sleep mode toggle switch overrides (hardcoded colors in AlarmsPage) */
        .sleep .toggle-checkbox:checked {
            border-color: #FF6B35 !important;
        }

        .sleep .toggle-checkbox:checked+.toggle-label {
            background-color: #FF6B35 !important;
        }

        /* Sleep mode: Override any remaining blue/indigo elements */
        .sleep .shadow-indigo-500\/30 {
            --tw-shadow-color: rgba(255, 107, 53, 0.3) !important;
        }

        .sleep .hover\:bg-indigo-600:hover {
            background-color: #E55A2B !important;
        }

        .sleep .dark\:hover\:bg-indigo-500:hover {
            background-color: #FF6B35 !important;
        }

        /* Skip link for screen readers */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            padding: 0.5rem 1rem;
            background: #6366F1;
            color: white;
            z-index: 100;
        }

        .skip-link:focus {
            left: 0;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Safe area insets for notched devices */
        :root {
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-left: env(safe-area-inset-left, 0px);
            --safe-area-inset-right: env(safe-area-inset-right, 0px);
        }

        .safe-area-top {
            padding-top: var(--safe-area-inset-top);
        }

        .safe-area-bottom {
            padding-bottom: var(--safe-area-inset-bottom);
        }

        /* Respect user's reduced motion preference */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Mobile touch optimization */
        button,
        a,
        [role="button"] {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Prevent iOS bounce/rubber-band scrolling issues */
        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        /* Smooth scroll for main content areas */
        .overflow-y-auto {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        /* Prevent body scroll when modal is open */
        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
    </style>
</head>

<body class="antialiased font-sans safe-area-top" style="background-color: #0F172A">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
