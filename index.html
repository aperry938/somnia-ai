<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F0F4F8" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Somnia.ai">
    <meta name="description"
        content="Intelligent sleep and dream wellness application. Track your dreams, analyze patterns, and improve your sleep.">
    <meta property="og:title" content="Somnia.ai | Intelligent Dream Journal">
    <meta property="og:description"
        content="Track your dreams with AI-powered analysis. Understand patterns, symbols, and improve your sleep quality.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Somnia.ai">
    <meta name="twitter:description" content="AI-powered dream journal and sleep wellness app">
    <title>Somnia.ai | Intelligent Alarm & Dream Journal</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Quattrocento:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Quattrocento', 'serif'],
                    },
                    colors: {
                        'day-bg-start': '#F0F4F8',
                        'day-bg-end': '#D9E2EC',
                        'day-text-primary': '#1E293B',
                        'day-text-secondary': '#475569',
                        'day-accent': '#6366F1',
                        'day-card-bg': 'rgba(255, 255, 255, 0.65)',
                        'day-border': 'rgba(0, 0, 0, 0.08)',
                        'night-bg-start': '#0F172A',
                        'night-bg-end': '#1E293B',
                        'night-text-primary': '#E2E8F0',
                        'night-text-secondary': '#94A3B8',
                        'night-accent': '#818CF8',
                        'night-card-bg': 'rgba(30, 41, 59, 0.65)',
                        'night-border': 'rgba(255, 255, 255, 0.1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        inhale: {
                            'from': { transform: 'scale(0.8)', opacity: '0.7' },
                            'to': { transform: 'scale(1.6)', opacity: '1' }
                        },
                        exhale: {
                            'from': { transform: 'scale(1.6)', opacity: '1' },
                            'to': { transform: 'scale(0.8)', opacity: '0.7' }
                        },
                        'box-breathing-path': {
                            '0%': { strokeDashoffset: '480' },
                            '25%': { strokeDashoffset: '360' },
                            '50%': { strokeDashoffset: '240' },
                            '75%': { strokeDashoffset: '120' },
                            '100%': { strokeDashoffset: '0' }
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.5s ease-in-out',
                        'inhale-4s': 'inhale 4s linear forwards',
                        'exhale-8s': 'exhale 8s linear forwards',
                        'exhale-4s': 'exhale 4s linear forwards',
                        'box-breathing-16s': 'box-breathing-path 16s linear infinite'
                    }
                }
            }
        }
    </script>
    <style>
        /* Circadian Deep Night - even darker than regular night */
        html[data-circadian-phase="night"].dark {
            --night-bg-start: #050810;
            --night-bg-end: #0a0f1a;
            --night-card-bg: rgba(10, 15, 30, 0.8);
        }
        
        /* Circadian Dusk/Dawn - uses warmer tones */
        html[data-circadian-phase="dusk"].dark,
        html[data-circadian-phase="dawn"].dark {
            --night-bg-start: #0F172A;
            --night-bg-end: #1E293B;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(100, 116, 139, 0.3);
            border-radius: 6px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3);
        }

        /* Focus-visible for keyboard navigation accessibility */
        :focus-visible {
            outline: 2px solid #6366F1;
            outline-offset: 2px;
        }

        .dark :focus-visible {
            outline-color: #818CF8;
        }

        /* Skip link for screen readers */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            padding: 0.5rem 1rem;
            background: #6366F1;
            color: white;
            z-index: 100;
        }

        .skip-link:focus {
            left: 0;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Safe area insets for notched devices */
        :root {
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-left: env(safe-area-inset-left, 0px);
            --safe-area-inset-right: env(safe-area-inset-right, 0px);
        }

        .safe-area-top {
            padding-top: var(--safe-area-inset-top);
        }

        .safe-area-bottom {
            padding-bottom: var(--safe-area-inset-bottom);
        }

        /* Respect user's reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Mobile touch optimization */
        button, a, [role="button"] {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>

<body class="antialiased font-sans safe-area-top">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
